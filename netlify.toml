[build]
  base = "frontend"
  publish = "frontend/dist"
  command = "npm install && npm run build"

[[redirects]]
  from = "/api/*"
  to = "https://english-coach-app-production.up.railway.app/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"